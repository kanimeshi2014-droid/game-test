<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mapbox単体テスト</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; position: absolute; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // アクセストークン
        mapboxgl.accessToken = 'pk.eyJ1IjoiYWlib2giLCJhIjoiY21wOWEyOXJtMGxnYzJ4cTJscHhnNmpsaCJ9.c2qa44JegpvESuYr9UKsDA'; 
        
        // 地図の初期化（東京駅を中心に表示）
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12', // 👈 ここを light-v11 に書き換えます
            center: [139.7671, 35.6812], 
            zoom: 14
        });
    </script>
</body>
</html>
