<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mapbox単体テスト</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; position: absolute; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // アクセストークン
        mapboxgl.accessToken = 'pk.eyJ1IjoiYWlib2giLCJhIjoiY21wOWEyOXJtMGxnYzJ4cTJscHhnNmpsaCJ9.c2qa44JegpvESuYr9UKsDA'; 
        
        // 地図の初期化（東京駅を中心に表示）
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12', // 👈 ここを light-v11 に書き換えます
            center: [139.7671, 35.6812], 
            zoom: 14
        });
        // 👇 地図が読み込まれたら、3D建物のレイヤーを追加する魔法の呪文
map.on('style.load', () => {
    // 3D建物のレイヤーを追加
    map.addLayer({
        'id': '3d-buildings',
        'source': 'composite',
        'source-layer': 'building',
        'filter': ['==', 'extrude', 'true'],
        'type': 'fill-extrusion', // 👈 これが立体化の命令
        'minzoom': 15, // これよりズームアウトすると2Dに戻る
        'paint': {
            'fill-extrusion-color': '#aaa', // 建物の色
            'fill-extrusion-height': [
                'interpolate', ['linear'], ['zoom'],
                15, 0, // ズーム15では高さ0
                15.05, ['get', 'height'] // それ以上で実際の高さへ
            ],
            'fill-extrusion-base': ['get', 'min_height'], // 建物の底の高さ
            'fill-extrusion-opacity': 0.6 // ちょっと透けさせる
        }
    });
});
        
        
        
        
        // 👇 地図の文字を日本語にする魔法の呪文
map.on('style.load', () => {
    map.getStyle().layers.forEach(layer => {
        if (layer.layout && layer.layout['text-field']) {
            map.setLayoutProperty(layer.id, 'text-field', [
                'coalesce',
                ['get', 'name_ja'], // まず日本語の名前を探す
                ['get', 'name']     // なければデフォルトの名前を使う
            ]);
        }
    });
});
    </script>
</body>
</html>
